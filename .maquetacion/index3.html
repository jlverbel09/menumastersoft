<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MenuMasterSoft - Bienvenido</title>
    <!-- Bootstrap 5 & Google Fonts -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>
        :root {
            --color-principal: #0984E3;
            --azul-oscuro: #0a3d62;
            --bg-light: #f7f9fc;
            --shadow: 0 10px 30px rgba(9, 132, 227, 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-light);
            color: #2d3436;
            margin: 0;
            padding-bottom: 80px;
        }

        /* Hero Section con Logo */
        .hero-section {
            background: linear-gradient(135deg, #ffffff 0%, #eef2f7 100%);
            padding: 40px 20px;
            text-align: center;
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
            box-shadow: var(--shadow);
        }

        .main-logo {
            height: 80px;
            margin-bottom: 20px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1));
        }

        .welcome-text h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--azul-oscuro);
            margin-bottom: 5px;
        }

        .welcome-text p {
            color: #636e72;
            font-size: 0.9rem;
        }

        /* Buscador Destacado */
        .search-box {
            margin-top: -25px;
            padding: 0 25px;
        }

        .search-input-wrapper {
            background: white;
            border-radius: 15px;
            padding: 5px 15px;
            display: flex;
            align-items: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
        }

        .search-input-wrapper input {
            border: none;
            padding: 12px;
            width: 100%;
            outline: none;
            font-size: 0.95rem;
        }

        .search-input-wrapper i {
            color: var(--color-principal);
            font-size: 1.2rem;
        }

        /* Categorías Grid */
        .section-title {
            padding: 25px 25px 15px;
            font-weight: 700;
            font-size: 1.1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 0 20px;
        }

        .category-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid rgba(0,0,0,0.03);
        }

        .category-card:active {
            transform: scale(0.95);
            background-color: #f1f2f6;
        }

        .cat-icon {
            width: 50px;
            height: 50px;
            background: rgba(9, 132, 227, 0.1);
            color: var(--color-principal);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            font-size: 1.5rem;
        }

        .category-card span {
            font-weight: 600;
            font-size: 0.9rem;
            display: block;
        }

        /* Sugerencia del Chef (Horizontal Scroll) */
        .promo-scroll {
            display: flex;
            overflow-x: auto;
            padding: 10px 20px;
            gap: 15px;
            scrollbar-width: none;
        }
        .promo-scroll::-webkit-scrollbar { display: none; }

        .promo-card {
            min-width: 280px;
            height: 160px;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px;
        }

        .promo-card img {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .promo-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            z-index: 2;
        }

        .promo-content { position: relative; z-index: 3; }

        /* Footer Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            border-top: 1px solid #eee;
            z-index: 1000;
        }

        .nav-item {
            text-align: center;
            color: #b2bec3;
            text-decoration: none;
            font-size: 0.75rem;
        }

        .nav-item.active {
            color: var(--color-principal);
        }

        .nav-item i {
            font-size: 1.4rem;
            display: block;
        }
    </style>
</head>
<body>

    <!-- Hero Header -->
    <header class="hero-section">
        <!-- Reemplazar con la URL de tu imagen de logo cargada anteriormente -->
        <img src="https://i.ibb.co/Lz0D7xR/Menu-Master-Soft-Logo.png" alt="MenuMasterSoft" class="main-logo">
        <div class="welcome-text">
            <h1>¡Hola! Bienvenido</h1>
            <p><i class="bi bi-geo-alt-fill me-1"></i> Restaurante "La Parrilla de Master" - Mesa 08</p>
        </div>
    </header>

    <!-- Buscador -->
    <div class="search-box">
        <div class="search-input-wrapper">
            <i class="bi bi-search"></i>
            <input type="text" placeholder="¿Qué se te antoja hoy?">
        </div>
    </div>

    <!-- Sugerencias -->
    <div class="section-title">
        <span>Sugerencias del Chef</span>
        <small class="text-primary">Ver todo</small>
    </div>
    <div class="promo-scroll">
        <div class="promo-card">
            <img src="https://images.unsplash.com/photo-1544025162-d76694265947?w=500" alt="Corte de Carne">
            <div class="promo-overlay"></div>
            <div class="promo-content">
                <h6 class="m-0 fw-bold">Tomahawk Prime</h6>
                <small>Especialidad de la casa</small>
            </div>
        </div>
        <div class="promo-card">
            <img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=500" alt="Pizza Gourmet">
            <div class="promo-overlay"></div>
            <div class="promo-content">
                <h6 class="m-0 fw-bold">Pizza Burrata</h6>
                <small>Receta Italiana</small>
            </div>
        </div>
    </div>

    <!-- Categorías -->
    <div class="section-title">
        <span>Explorar Menú</span>
    </div>
    <div class="category-grid">
        <a href="#" class="category-card">
            <div class="cat-icon"><i class="bi bi-egg-fried"></i></div>
            <span>Entradas</span>
        </a>
        <a href="#" class="category-card">
            <div class="cat-icon"><i class="bi bi-fire"></i></div>
            <span>Platos Fuertes</span>
        </a>
        <a href="#" class="category-card">
            <div class="cat-icon"><i class="bi bi-cup-straw"></i></div>
            <span>Bebidas</span>
        </a>
        <a href="#" class="category-card">
            <div class="cat-icon"><i class="bi bi-cake2"></i></div>
            <span>Postres</span>
        </a>
    </div>

    <!-- Navegación Inferior -->
    <nav class="bottom-nav">
        <a href="#" class="nav-item active">
            <i class="bi bi-house-door-fill"></i>
            Inicio
        </a>
        <a href="#" class="nav-item">
            <i class="bi bi-book"></i>
            Carta
        </a>
        <a href="#" class="nav-item">
            <i class="bi bi-cart3"></i>
            Pedido
        </a>
        <a href="#" class="nav-item">
            <i class="bi bi-person"></i>
            Mesero
        </a>
    </nav>

</body>
</html>
